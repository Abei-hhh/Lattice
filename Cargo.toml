[workspace]
resolver = "2"
members = ["crates/core"]

# 把常用依赖版本提到 workspace 级，让 core 和 app 共享一致版本（避免 reqwest /
# tokio 等被两次编译为不同版本）。
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
dirs = "5"

# ── 主 binary（Windows 桌面 GUI 壳）─────────────────────────────
[package]
name = "lattice"
version = "0.1.0"
edition = "2021"

[dependencies]
# 共享 core（平台无关：网络 / 缓存 / 配置 / runtime flags / cc-switch）
lattice-core = { path = "crates/core" }

windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
] }

tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = "0.22"
chrono = { version = "0.4", features = ["serde"] }
tracing = { workspace = true }
tracing-subscriber = "0.3"
dirs = { workspace = true }
sysinfo = "0.33"
clap = { version = "4", features = ["derive"] }

[build-dependencies]
# 应用图标流水线：SVG → 多尺寸 RGBA → .ico → 链接进 exe 资源段。
# 这些只在 build time 用，不增加最终 exe 体积。
resvg = "0.44"
tiny-skia = "0.11"
usvg = "0.44"
embed-resource = "2.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
